<!---
  Where Orbit's data comes from: one element per endpoint of its own API
  (see ../server.ts), fetched by `std-data` while the page renders.

  `<:include>` rather than `<:import>`: these are instances, not definitions,
  and an instance is spliced exactly where it is named. That matters here --
  a scope's name resolves where its markup is WRITTEN, so bringing this file
  in at the top of <body> is what puts `servicesSrc` and the rest within
  reach of the values <body> derives from them.

  `:apiBase` on the root below is this fragment's one setting. A root
  element's attributes are copied onto whatever contains the `<:include>`,
  unless that element already declares them -- so this is a default, and a
  page pointing Orbit at a different host says so where it includes the file:

      <body :apiBase="https://staging.example.test/api">
        <:include src="/orbit/sources.htm" />

  Nothing here has to change for that, and nothing here is special for being
  an application's file rather than a library's: it is the same mechanism the
  Bootstrap kit's URL and theme tokens use.
-->
<lib :apiBase="/api">
<!---
  They render nothing; where they are WRITTEN is where their names resolve,
  so they sit at the top of the page that reads them.

  `incidentsSrc` is the interesting one: its URL is built out of another
  source's answer, so it cannot even be asked for until `services` has
  replied. The render waits for the first, then for the second, and still
  serves a finished page — which one round of fetching could not do.
-->
<std-data :aka="servicesSrc"  :url=${apiBase + '/services'} />
<std-data :aka="deploysSrc"   :url=${apiBase + '/deploys'} />
<std-data :aka="activitySrc"  :url=${apiBase + '/activity'} />
<std-data :aka="todosSrc"     :url=${apiBase + '/todos'} />
<std-data :aka="trafficSrc"   :url=${apiBase + '/metrics/traffic'} />
<std-data :aka="faultsSrc"    :url=${apiBase + '/metrics/faults'} />
<std-data :aka="latenciesSrc" :url=${apiBase + '/metrics/latencies'} />
<std-data :aka="endpointsSrc" :url=${apiBase + '/metrics/endpoints'} />
<std-data :aka="zonesSrc"     :url=${apiBase + '/metrics/zones'} />
<std-data :aka="incidentsSrc"
          :url=${servicesSrc.data
            ? apiBase + '/incidents?services='
              + servicesSrc.data.filter(s => s.state !== 'ok').map(s => s.id).join(',')
            : ''} />
</lib>
