name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `ci`, not `install`: it installs the lockfile exactly and fails if
      # package.json has moved away from it. `npm install` is allowed to
      # resolve within ranges and rewrite the lockfile, so every green
      # build was against whatever npm happened to resolve that morning
      # rather than against what is committed.
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The TESTS' types, which nothing else here reads. `npm test` runs
      # vitest, which transpiles without checking, and `npm run build` checks
      # each workspace's `tsconfig.json`, which covers src alone -- so two
      # type errors sat in test files through every green build until someone
      # ran this by hand.
      - run: npm run typecheck