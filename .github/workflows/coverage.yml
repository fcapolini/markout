name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `ci`, not `install`: it installs the lockfile exactly and fails if
      # package.json has moved away from it. `npm install` is allowed to
      # resolve within ranges and rewrite the lockfile, so every green
      # build was against whatever npm happened to resolve that morning
      # rather than against what is committed.
      - run: npm ci --no-audit --no-fund
      - run: npm run test-coverage