<svg width="24" height="24" viewBox="0 0 683 683" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The Markout mark for the activity bar: the logo as line art, so it sits
     with the outline glyphs VS Code ships rather than reading as a filled
     blob among them.

     Both corners at the same height. The mark is symmetric under a half turn
     in every respect but one: the apexes were drawn 10 units apart
     vertically, so the two corners did not line up. Each half moves half of
     that, which lands both on the midpoint the tips were already mirrored
     about, and makes the symmetry exact.

     The corners are rounded in the GEOMETRY, not by `stroke-linejoin`. A
     round join rounds a corner by half the stroke and no more, which is
     0.7px at 24px and reads as sharp beside the icons above and below it.
     Each corner instead backs off along both arms and closes with a
     quadratic whose control point is the vertex the corner used to be.

     Softened, not rounded off: 50 gives 1.8px of corner, which is enough
     to stop it looking sharp and little enough that it still reads as an
     angle bracket. The arrowheads take 24, because they are about 57 degrees
     rather than 90, and the same radius on both blunts a head long before a
     chevron looks soft.

     The arrowhead barbs are 193 units rather than the 143 they were drawn
     at, and the chevrons are otherwise untouched. A barb points back INTO
     the mark, so lengthening one changes nothing about the box until it
     reaches the opposite apex, at about +104.

     Square viewBox with the artwork inset: the container fits an icon into a
     square slot, so a drawing that reaches every edge crowds its neighbours
     in a column where everything else has air around it.

     `currentColor`, so it takes the ink of whichever theme is running.
     Stroke 40 renders at 1.41px at 24px.

     No double hyphen anywhere in this comment. XML forbids one inside a
     comment, and an SVG that does not parse is an icon that silently does
     not appear. -->
<g transform="translate(42.9, 91.21)">
  <path d="M253.6 13.04 L52.41 214.9 Q17.1 250.3 52.38 285.7 L235.3 469.4" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M343.6 487.5 L544.8 285.7 Q580.1 250.3 544.8 214.9 L361.9 31.14" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198.8 197.7 L246.8 36.05 Q253.6 13.04 230.6 19.77 L68.51 67.1" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M529.6 432.9 L366.6 480.8 Q343.6 487.5 350.5 464.5 L399.4 302.6" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
