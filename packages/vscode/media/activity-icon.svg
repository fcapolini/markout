<svg width="24" height="24" viewBox="0 0 683 683" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The Markout mark for the activity bar: the logo as line art, so it sits
     with the outline glyphs VS Code ships rather than reading as a filled
     blob among them.

     One path per chevron and per arrowhead, with `stroke-linejoin="round"`,
     so each corner is a rounded JOIN. Drawn as separate segments meeting at a
     point, the corners were two round caps overlapping, which is blunter and
     reads as a lump at 24px.

     The arrowhead arms are pushed 65 units past the chevrons. That is the
     most they can travel for free: the drawing is wider than it is tall, so
     up to about 68 the width still decides the square box and the stroke
     stays at 1.41px. Beyond that the box grows and the line thins.

     Square viewBox with the artwork inset: the container fits an icon into a
     square slot, so a drawing that reaches every edge crowds its neighbours
     in a column where everything else has air around it.

     `currentColor`, so it takes the ink of whichever theme is running.

     No double hyphen anywhere in this comment. XML forbids one inside a
     comment, and an SVG that does not parse is an icon that silently does
     not appear. -->
<g transform="translate(42.9, 91.21)">
  <path d="M299.5 -27.96 L17.1 255.3 L235.3 474.5" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M297.7 528.5 L580.1 245.3 L361.9 26.11" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M259 108.8 L299.5 -27.96 L162.4 12.08" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M435.8 488 L297.7 528.5 L339.1 391.5" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
