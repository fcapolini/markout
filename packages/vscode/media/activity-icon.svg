<svg width="24" height="24" viewBox="0 0 683 683" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The Markout mark for the activity bar: the logo as line art, so it sits
     with the outline glyphs VS Code ships rather than reading as a filled
     blob among them.

     One path per chevron and per arrowhead, with `stroke-linejoin="round"`,
     so each corner is a rounded JOIN. Drawn as separate segments meeting at a
     point the corners were two round caps overlapping, which is blunter than
     a corner and reads as a lump at 24px.

     The arrowhead barbs are 193 units rather than the 143 they were drawn
     at. The chevrons are untouched: a barb points back INTO the mark, so
     lengthening one changes nothing about the box until it reaches the
     opposite apex, which is about +104. At +50 the heads read as heads with
     room to spare, and the stroke is still 1.41px.

     Square viewBox with the artwork inset: the container fits an icon into a
     square slot, so a drawing that reaches every edge crowds its neighbours
     in a column where everything else has air around it.

     `currentColor`, so it takes the ink of whichever theme is running.

     No double hyphen anywhere in this comment. XML forbids one inside a
     comment, and an SVG that does not parse is an icon that silently does
     not appear. -->
<g transform="translate(42.9, 91.21)">
  <path d="M253.6 18.07 L17.1 255.3 L235.3 474.5" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M343.6 482.5 L580.1 245.3 L361.9 26.11" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198.8 202.7 L253.6 18.07 L68.51 72.13" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M529.6 427.9 L343.6 482.5 L399.4 297.6" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
