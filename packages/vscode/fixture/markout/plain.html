<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ordinary HTML</title></head>
<body>
  <h1>No markout in this file at all</h1>
  <p>Costs $5, or 50% off. Nothing here is reported, and nothing should be:
     plain HTML is a subset, and this extension has no opinion about it.</p>
  <script>
    // a template literal, which is NOT markout interpolation
    const greet = name => `hello ${name}`;
  </script>
</body>
</html>
