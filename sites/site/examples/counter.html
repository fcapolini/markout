<html lang="en">
<head>
  <:import src="/npm/@markout-lang/bootstrap-kit/all.htm" />
  <title>A button that counts</title>
</head>
<body class="p-4 text-center">
  <button class="btn btn-primary"
          :count=${0}
          :on-click=${() => count++}>
    Clicked ${count} time${count !== 1 ? 's' : ''}
  </button>
</body>
</html>
