<html lang="en" :accent=${'#6f42c1'}>
<head>
  <:import src="/npm/@markout-lang/bootstrap-kit/all.htm" />
  <bs-theme-auto />
  <style>
    .btn-primary { --bs-btn-bg: ${accent}; --bs-btn-border-color: ${accent}; }
  </style>
</head>
<body class="p-4 text-center">
  <button class="btn btn-primary" :count=${0}
          :on-click=${() => count++}>
    Clicked ${count} time${count !== 1 ? 's' : ''}
  </button>
  <button class="btn btn-sm btn-outline-secondary ms-2"
          :on-click=${() => accent = accent === '#6f42c1' ? '#198754' : '#6f42c1'}>
    Change theme
  </button>
</body>
</html>
