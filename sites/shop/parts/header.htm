<!---
  The header, included by every page.

  `$url.pathname` is what marks the current link, which is the whole of what
  this needs from the outside: no page tells it where it is.
-->
<lib>
  <header>
    <a class="brand" href="/">The Bench</a>
    <nav>
      <a href="/" :class-active=${$url?.pathname === '/' || $url?.pathname === '/index.html'}>Catalog</a>
      <a href="/cart.html" :class-active=${$url?.pathname === '/cart.html'}>
        Cart<span :if=${basket.count > 0}> (${basket.count})</span>
      </a>
    </nav>
  </header>
</lib>
