<!---
  The header, included by every page.

  It reads two things: where we are, and what is in the basket. Every page's
  view carries a `basket`, so this needs no value of its own -- and `$url` is
  what marks the current link, so no page tells it where it is either.
-->
<lib>
  <header>
    <a class="brand" href="/">The Bench</a>
    <nav>
      <a href="/" :class-active=${$url?.pathname === '/' || $url?.pathname === '/index.html'}>Catalog</a>
      <a href="/cart.html" :class-active=${$url?.pathname === '/cart.html'}>
        Cart<span :if=${view.basket.count > 0}> (${view.basket.count})</span>
      </a>
    </nav>
  </header>
</lib>
