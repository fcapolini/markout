<lib
  :bsBtnRadius="0.5rem"
  :bsCardRadius="0.5rem"
  >
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous" async></script>
  <style>
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }

      body { background-color: #121820; color: #edf2f7; }
      .bg-light { background-color: #18222d !important; }
      .bg-white, .card, .list-group-item { background-color: #1b2632 !important; }
      .border, .border-top, .border-bottom, .border-end { border-color: #384858 !important; }
      .text-muted { color: #afbdc9 !important; }
      .navbar-light .navbar-nav .nav-link { color: #dbe5ee; }
      .navbar-light .navbar-nav .nav-link:hover, .navbar-light .navbar-nav .nav-link:focus { color: #fff; }
      .navbar-toggler { border-color: #6c7d8e; filter: invert(1); }
      .btn-outline-secondary { border-color: #afbdc9; color: #dbe5ee; }
      .btn-outline-secondary:hover { background-color: #afbdc9; color: #121820; }
      .list-group-item { border-color: #384858; color: #edf2f7; }
      .list-group-item-action:hover, .list-group-item-action:focus { background-color: #253443; color: #fff; }
      #work article.bg-white.text-dark { color: #edf2f7 !important; }
      #work article.bg-white .badge { background-color: #253443 !important; color: #edf2f7 !important; }
    }
  </style>
</lib>
